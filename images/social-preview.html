<!--
The source of images/social-preview.png, the picture GitHub shows when a link to the repository
is shared (Settings, General, Social preview). It's 1280 by 640, GitHub's size. To make it again
after a change, render it on a Mac with Chrome (the text is laid out for the Mac's system font;
another font is wider and may not fit), from the checkout, then upload it on GitHub again:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --force-device-scale-factor=1 --window-size=1280,640 \
    --screenshot="$PWD/images/social-preview.png" "file://$PWD/images/social-preview.html"

The logo is images/mia-logo-dark.svg's. tests/test_repo.py checks the picture's size, and that it
holds no metadata.
-->
