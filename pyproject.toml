# The mia Python package. This file also pins the test and lint tools, so a new release of one
# can't fail an unrelated pull request; Renovate proposes updates, and uv.lock holds the hashes.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mia"
dynamic = ["version"]
description = "A macOS stack for generating AI images with open models, through a web page, an API, and MCP."
license = "AGPL-3.0-only"
# The engine doesn't install on Python 3.15 yet: mflux needs sentencepiece, which has no wheels for it.
requires-python = ">=3.12,<3.15"
# Only what the server needs. It never imports the engine's packages.
# cryptography makes the certificates for HTTPS on your LAN.
dependencies = ["cryptography==50.0.2", "fastapi==0.162.0", "h11==0.16.0", "httpx2==2.16.0", "mcp==2.3.0", "uvicorn==0.54.0"]

[project.scripts]
mia = "mia.cli:main"

[project.optional-dependencies]
# The real engine, kept out of the base install because it brings PyTorch. Apple Silicon only.
engine = [
    "mflux==0.24.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Pinned on its own because it decides the pixels: another version gives a slightly different
    # image from the same seed, so moving it means a new expected value in scripts/real-engine.sh.
    "mlx==0.32.4 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # 13.0.0 fixes 39 known vulnerabilities, and mflux requires it.
    "pillow==13.0.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "ruff==0.17.1",
    "bandit==1.9.4",
    "mypy==2.4.0",
    "zizmor==1.31.1",
    "pip-audit==2.10.1",
    # FastAPI's test client needs it.
    "httpx2==2.16.0",
]

[tool.uv]
# The Mac mia runs on, and Linux for CI's tests and for mia mcp on another machine. Nothing else needs a resolution.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux'"]

[tool.setuptools.dynamic]
version = { attr = "mia.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra lists skipped tests and why at the end of each run.
addopts = "-ra --strict-markers"
# A test that hangs fails after a minute with a traceback of where it was stuck. A test that
# needs longer says so with @pytest.mark.timeout(seconds).
timeout = 60

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Rules that find bugs and risky code rather than style: pyflakes, pycodestyle errors, bugbear,
# pyupgrade, simplify, perflint, async, security (bandit's rules), and pylint's errors and warnings.
select = ["E4", "E7", "E9", "F", "B", "UP", "SIM", "PERF", "ASYNC", "S", "PLE", "PLW", "RUF"]
ignore = [
    "S603",  # subprocess calls with argument lists (no shell) are how the tests run tools
    "S607",  # tools such as git are found on PATH, as a user's shell would find them
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use temporary paths, and write example secrets on purpose.
"tests/**" = ["S101", "S105", "S106", "S108"]
# Queries put together only from our own column lists, with every value bound as a parameter.
"src/mia/{history,jobs,tokens}.py" = ["S608"]

[tool.bandit]
exclude_dirs = ["tests"]
# Same reasons as the ruff ignores above.
skips = ["B404", "B603", "B607"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

# The engine's packages may or may not be installed, and have no types either way.
[[tool.mypy.overrides]]
module = ["mflux.*", "mlx.*", "PIL.*", "huggingface_hub.*"]
ignore_missing_imports = true
follow_imports = "skip"
